name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  IMAGE_NAME: lab6-app
  CONTAINER_APP: lab6_app
  CONTAINER_DB: lab6_db
  NETWORK_NAME: lab6_network
  DB_NAME: lab6_db
  DB_USER: postgres
  DB_PASSWORD: postgres

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Docker network
        run: docker network create ${{ env.NETWORK_NAME }}

      - name: Start PostgreSQL container
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_DB }} \
            --network ${{ env.NETWORK_NAME }} \
            -e POSTGRES_DB=${{ env.DB_NAME }} \
            -e POSTGRES_USER=${{ env.DB_USER }} \
            -e POSTGRES_PASSWORD=${{ env.DB_PASSWORD }} \
            postgres:15-alpine

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 15); do
            if docker exec ${{ env.CONTAINER_DB }} pg_isready -U ${{ env.DB_USER }}; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Attempt $i/15 - waiting 2s..."
            sleep 2
          done

      - name: Initialize database schema
        run: |
          docker cp db/init.sql ${{ env.CONTAINER_DB }}:/init.sql
          docker exec ${{ env.CONTAINER_DB }} \
            psql -U ${{ env.DB_USER }} -d ${{ env.DB_NAME }} -f /init.sql

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest ./app

      - name: Start application container
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_APP }} \
            --network ${{ env.NETWORK_NAME }} \
            -p 3000:3000 \
            -e DB_HOST=${{ env.CONTAINER_DB }} \
            -e DB_PORT=5432 \
            -e DB_NAME=${{ env.DB_NAME }} \
            -e DB_USER=${{ env.DB_USER }} \
            -e DB_PASSWORD=${{ env.DB_PASSWORD }} \
            -e PORT=3000 \
            ${{ env.IMAGE_NAME }}:latest

      - name: Wait for application to be ready
        run: |
          echo "Waiting for app to start..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/health; then
              echo "App is ready!"
              break
            fi
            echo "Attempt $i/15 - waiting 2s..."
            sleep 2
          done

      - name: Run health check test
        run: |
          echo "=== TEST: Health endpoint ==="
          RESPONSE=$(curl -sf http://localhost:3000/health)
          echo "Response: $RESPONSE"
          echo $RESPONSE | grep -q '"status":"ok"'
          echo "[PASS] Health check passed"

      - name: Run API tests
        run: |
          echo "=== TEST: GET /api/items ==="
          curl -sf http://localhost:3000/api/items
          echo ""
          echo "[PASS] GET /api/items returned 200"

          echo "=== TEST: POST /api/items ==="
          curl -sf -X POST http://localhost:3000/api/items \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Test Item"}'
          echo ""
          echo "[PASS] POST /api/items returned 200"

          echo "=== TEST: Verify item was created ==="
          ITEMS=$(curl -sf http://localhost:3000/api/items)
          echo "Items: $ITEMS"
          echo $ITEMS | grep -q "CI Test Item"
          echo "[PASS] Item found in database"

      - name: Show container logs
        if: always()
        run: |
          echo "=== App Logs ==="
          docker logs ${{ env.CONTAINER_APP }}
          echo "=== DB Logs ==="
          docker logs ${{ env.CONTAINER_DB }}

      - name: Show container status
        if: always()
        run: |
          docker ps -a

      - name: Cleanup containers and network
        if: always()
        run: |
          docker stop ${{ env.CONTAINER_APP }} ${{ env.CONTAINER_DB }} 2>/dev/null || true
          docker rm   ${{ env.CONTAINER_APP }} ${{ env.CONTAINER_DB }} 2>/dev/null || true
          docker network rm ${{ env.NETWORK_NAME }} 2>/dev/null || true
          echo "[OK] Cleanup complete"

  push-to-dockerhub:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "[ERROR] Missing GitHub secret: DOCKERHUB_USERNAME"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "[ERROR] Missing GitHub secret: DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: Normalize Docker Hub username
        id: dockerhub
        run: |
          USERNAME="$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr -d '[:space:]')"
          if [ -z "$USERNAME" ]; then
            echo "[ERROR] DOCKERHUB_USERNAME is empty after trimming whitespace"
            exit 1
          fi
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ steps.dockerhub.outputs.username }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.dockerhub.outputs.username }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image URL
        run: |
          echo "✅ Image pushed to Docker Hub:"
          echo "   https://hub.docker.com/r/${{ steps.dockerhub.outputs.username }}/${{ env.IMAGE_NAME }}"
          echo "   Tags: latest, ${{ github.sha }}"
